<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مزعج - لوحة التحكم</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="matrix-bg">
    <canvas id="matrix"></canvas>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo"><h2 class="glitch" data-text="مزعج">مزعج</h2></div>
            <nav>
                <a href="#" class="active"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</a>
            </nav>
        </aside>
        <main class="main-content">
            <header>
                <h1 id="welcomeMsg">مرحباً...</h1>
                <span id="userEmail"></span>
            </header>
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-server"></i>
                    <div><h3 id="serverStatus">متوقف</h3><p>حالة السيرفر</p></div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-memory"></i>
                    <div><h3 id="memoryUsage">0 MB</h3><p>استخدام الذاكرة</p></div>
                </div>
            </div>
            <div class="upload-section">
                <h2><i class="fas fa-upload"></i> رفع البوت</h2>
                <div class="upload-box" id="uploadBox">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>اسحب الملفات هنا أو انقر للاختيار</p>
                    <small style="color:#ff0;">⚠️ يجب أن يكون اسم الملف mozeg.py بالضبط</small>
                    <input type="file" id="fileInput" accept=".py" hidden>
                </div>
                <div id="fileDetails" class="file-details hidden">
                    <p><i class="fas fa-file-code"></i> <span id="fileName"></span></p>
                    <button onclick="uploadFile()" class="btn-primary"><i class="fas fa-play"></i> تشغيل البوت</button>
                </div>
            </div>
            <div class="logs-section">
                <h2><i class="fas fa-terminal"></i> سجل التشغيل</h2>
                <div class="terminal" id="terminal"><p class="log-info">جاري انتظار الملفات...</p></div>
            </div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/matrix.js"></script>
</body>
</html>
